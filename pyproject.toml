[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "freq"
version = "0.1.0"
description = "Frequency analysis of unevenly sampled RV time series (iterative GLS + l1 periodograms)"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
dependencies = ["numpy", "scipy", "pandas", "matplotlib"]

[project.urls]
Homepage = "https://github.com/john-livingston/freq"
Documentation = "https://john-livingston.github.io/freq"

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]
docs = ["mkdocs-material", "mkdocstrings[python]"]

[project.scripts]
freq = "freq.cli:main"

[tool.setuptools.packages.find]
include = ["freq*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["freq"]
omit = ["freq/gls.py", "freq/l1p/*"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_empty = true
exclude_lines = ["if __name__ == .__main__.:"]
